<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% if page.layout == "home" %}
        {{ site.title }}
      {% else %}
        {{ page.title }} | {{ site.title }}
      {% endif %}
    </title>
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="48x48">
    <link rel="icon" href="{{ site.baseurl }}/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/all.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <!-- Use Jekyll SEO plugin -->
    {% seo title=false %}
  </head>
  <body>
    <div class="site-container">
      {% include header.html %}
      {{ content }}
      {% include footer.html %}
    </div>
    <script data-goatcounter="https://ginelledoerr.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
