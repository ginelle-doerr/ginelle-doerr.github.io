<section>
  <div class="project-container">
    {% for project in site.data.settings.projects %}
      <a class="project-card" href="{{ site.baseurl }}/projects/{{ project.url }}">
        <img src="{{ site.baseurl }}/assets/img/projects/{{ project.url }}/thumbnail.jpg" alt="{{ project.name }}">
        <strong>{{ project.name }}</strong>
        <span>{{ project.tag }}</span>
      </a>
    {% endfor %}
  </div>
</section>
